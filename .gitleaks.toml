# gitleaks config for AIPG OSS release scanning.
# Extends gitleaks' default ruleset (API keys, AWS, private keys, JWTs, ...) with
# AIPG-specific leaks that the defaults DON'T catch: internal infra, local dev
# paths, R2 buckets, on-chain addresses. Use with:
#   gitleaks detect --source <repo> --config .gitleaks.toml --redact

[extend]
useDefault = true

[[rules]]
id = "aipg-internal-ip"
description = "Internal datacenter IP (Proxmox/LXC range)"
regex = '''\b(172\.(3[01])|10\.)\.\d{1,3}\.\d{1,3}\b'''
tags = ["aipg", "infra"]

[[rules]]
id = "aipg-local-dev-path"
description = "Local developer absolute path (leaks username / machine layout)"
regex = '''/Users/[a-z0-9._-]+/'''
tags = ["aipg", "infra"]

[[rules]]
id = "aipg-r2-bucket"
description = "Cloudflare R2 / internal bucket names"
regex = '''\b(aipgcoregen|aipg-transient|aipgcore[a-z0-9-]*)\b'''
tags = ["aipg", "infra"]

[[rules]]
id = "aipg-evm-private-key"
description = "EVM private key in a key-bearing assignment"
regex = '''(?i)(?:private[_ -]?key|wallet[_ -]?key|signer[_ -]?key)\s*[:=]\s*["']?(?:0x)?[a-f0-9]{64}\b'''
tags = ["aipg", "wallet"]

[[rules]]
id = "aipg-mnemonic"
description = "BIP-39 mnemonic / seed phrase markers"
regex = '''(?i)(mnemonic|seed[\s_-]?phrase)\s*[:=]\s*["']?(\w+\s+){11,}'''
tags = ["aipg", "wallet"]

[[allowlists]]
description = "Published AIPG Base token contract"
targetRules = ["generic-api-key"]
regexes = [
  '''(?i)^0xa1c0deCaFE3E9Bf06A5F29B7015CD373a9854608$''',
]

[[allowlists]]
description = "Deterministic invalid EVM test key"
targetRules = ["aipg-evm-private-key"]
regexTarget = "match"
regexes = [
  '''(?i)^PRIVATE_KEY=0x1{64}\b''',
]

[[allowlists]]
description = "Scanner definitions name the forbidden bucket patterns"
targetRules = ["aipg-r2-bucket"]
paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)\.github/workflows/secret-scan\.ya?ml$''',
]
